name: auto-update

# PCの電源が入っていなくてもクラウドで自動更新する。
#   morning: 08:10 JST 前日締め+今日の予想生成+オリジナル運用開始
#   night  : 23:40 JST 結果・談話の回収+払戻+決済
#   live   : 10:00-23:45 JST 15分ごとの速報反映(結果+払戻+決済)
# cronはUTC表記(JST-9時間)。スケジュール実行は数分遅れることがある。
on:
  schedule:
    - cron: "10 23 * * *"     # 08:10 JST = morning
    - cron: "40 14 * * *"     # 23:40 JST = night
    # 08:30-23:45 JST = live。以前は10:00開始で、08:30〜10:00に発走する
    # 朝のレースのオッズを丸ごと取り逃していた(カバー率が3割に留まっていた一因)
    - cron: "30,45 23 * * *"  # 08:30, 08:45 JST
    - cron: "*/15 0-14 * * *" # 09:00-23:45 JST
  workflow_dispatch:
    inputs:
      mode:
        description: "morning / night / live / push"
        default: "live"

concurrency:
  group: keirin-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Resolve mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "10 23 * * *") MODE=morning ;;
              "40 14 * * *") MODE=night ;;
              *) MODE=live ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "resolved mode: $MODE"

      - name: Run update
        run: |
          set -e
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" = "morning" ]; then
            python scripts/collect_raceresults.py --limit 150 --delay 0.5
            python scripts/backfill_payouts.py --limit 200 --delay 0.4
            python scripts/settle_original.py
            TODAY=$(TZ=Asia/Tokyo date +%F)
            STAMP=$(TZ=Asia/Tokyo date +%Y%m%d)
            python scripts/forecast_winticket_after.py --date "$TODAY" --after 00:00 --max-races 150 --delay 0.4 --out "data/forecast_${STAMP}_after_0000.json"
            python scripts/start_original.py
            python scripts/backfill_player_profiles.py --limit 250 --delay 0.5
          elif [ "$MODE" = "night" ]; then
            python scripts/collect_raceresults.py --limit 120 --delay 0.6
            python scripts/backfill_keirinjp_results.py --limit 60 --delay 0.5
            python scripts/backfill_payouts.py --limit 200 --delay 0.4
            python scripts/settle_original.py
          elif [ "$MODE" = "live" ]; then
            python scripts/collect_raceresults.py --limit 50 --delay 0.4
            python scripts/backfill_payouts.py --limit 80 --delay 0.3
            python scripts/settle_original.py
            # 値付けの歪みを探す研究の土台。全レースのオッズ盤を取りこぼさないよう
            # 2段構えにする: (1)締切間際=市場の最終結論 (2)広めの窓=変動履歴
            python scripts/snapshot_odds.py --window 12 --limit 40 --delay 0.3
            python scripts/snapshot_odds.py --window 75 --limit 40 --delay 0.3
            # 予想を作るのは朝の1回だけなので、そこが失敗するとその日は丸一日
            # 0件のままになる(2026-08-11〜14に4日間発生)。当日分が無い/空なら
            # ここで作り直して自力で復帰する。
            TODAY=$(TZ=Asia/Tokyo date +%F)
            STAMP=$(TZ=Asia/Tokyo date +%Y%m%d)
            FC="data/forecast_${STAMP}_after_0000.json"
            COUNT=$(python -c "import json,sys;print(len(json.load(open(sys.argv[1],encoding='utf-8')).get('forecasts',[])))" "$FC" 2>/dev/null || echo 0)
            if [ "$COUNT" = "0" ]; then
              echo "::warning::当日の予想が0件。live実行で作り直します"
              python scripts/forecast_winticket_after.py --date "$TODAY" --after 00:00 --max-races 150 --delay 0.4 --out "$FC"
              python scripts/start_original.py
            fi
          fi
          python scripts/build_static_api.py

          # --- ここから先はDBの保守。転んでも公開だけは必ず届ける ---
          #
          # 2026-08-22〜30、compact_db が例外で落ちた結果 commit まで到達せず、
          # 予想は毎回正しく作れていたのに一度もpushされずサイトが8日間凍結した。
          # 保守は「あとで直せるもの」、公開は「止めてはいけないもの」なので、
          # ここから下は全て || で受けてジョブを落とさない。
          # 保守が効かずDBが膨らんだ場合は healthcheck が92MBで検知する。
          #
          # DBが100MBを超えるとpushが拒否され自動更新が完全停止する(2026-08-04に発生)。
          python scripts/compact_db.py --apply --threshold-mb 80 \
            || echo "::warning::DB圧縮に失敗しました(公開は継続)"

          # 圧縮だけでは回収が頭打ち(2026-08-30時点で0.1MB程度)。
          # 85MBを超えたら、確定済みレースの2件目以降の予想も間引く。
          # 各レースの最初の予想は必ず残るので実績評価と決済には影響しない。
          DB_MB=$(du -m data/keirin_learning.sqlite3 | cut -f1)
          echo "DB after compact: ${DB_MB}MB"
          if [ "$DB_MB" -ge 85 ]; then
            echo "::warning::DBが${DB_MB}MB。確定済みレースの再予想を間引きます"
            python scripts/prune_predictions.py --apply \
              && python scripts/compact_db.py --apply --threshold-mb 0 \
              || echo "::warning::間引きに失敗しました(公開は継続)"
          fi

      - name: Commit and push
        run: |
          git config user.name "keirin-auto-update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          # push前の最終防衛線。95MBを超えていたら圧縮でも足りていないので、
          # 拒否される前に気づけるようログへ大きく出す。
          DB_MB=$(du -m data/keirin_learning.sqlite3 | cut -f1)
          echo "DB size: ${DB_MB}MB"
          if [ "$DB_MB" -ge 95 ]; then
            echo "::warning::DBが${DB_MB}MB。GitHubの上限100MBに接近しています(超えるとpushが拒否され自動更新が止まります)"
          fi
          git commit -m "Cloud update (${{ steps.mode.outputs.mode }}) $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            git pull --rebase origin main || { git rebase --abort || true; git pull -X ours --no-edit origin main; }
          done
          git push origin main

      # 配信物が壊れていないか最後に確かめる。ここが赤くなればGitHubから通知が来る。
      # 2026-08-11〜14、予想0件のまま4日間配信され続けたのに、Actionsは毎回
      # 「成功」と表示していた。同じ見逃しを繰り返さないための最終関門。
      # push の後に置くのは、集めた結果やDBの更新を捨てずに残すため。
      - name: Healthcheck
        run: python scripts/healthcheck.py

      # 止まったことに気づけるのが最重要。GitHubの失敗通知メールは当てにならず、
      # 2026-08-22〜30はヘルスチェックが8日間赤かったのに誰も気づけなかった。
      # どのステップで落ちてもここでLINEへ飛ばす。
      - name: Notify failure to LINE
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_line.py "競輪AIラボの自動更新が失敗しました"
