<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="競輪AIラボ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#080b10" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Keirin AI Lab</title>
    <link rel="stylesheet" href="styles.css?v=319157a3" />
  </head>
  <body data-page="home">
    <div class="app-shell">
      <aside class="sidebar" aria-label="メインナビゲーション">
        <div class="brand">
          <span class="brand-mark">K</span>
          <div class="brand-copy">
            <span class="brand-kicker">競輪予想ラボ</span>
            <h1>KEIRIN LAB</h1>
          </div>
        </div>

        <div class="status" id="status" role="status">起動中</div>

        <nav class="side-nav" aria-label="ページ切替">
          <a href="index.html" class="active">本日の予想</a>
          <a href="consult.html">車券コンサル</a>
          <a href="record.html">実績</a>
          <a href="results.html">結果と収支</a>
          <a href="motion.html">モーションメーカー</a>
        </nav>

        <section class="sidebar-group" aria-labelledby="today-filter-title">
          <div class="sidebar-title" id="today-filter-title">信頼度フィルター</div>
          <label class="field">
            <span>信頼度</span>
            <select id="confidenceFilter">
              <option value="all">すべて</option>
              <option value="本命">本命</option>
              <option value="順当">順当</option>
              <option value="混戦">混戦</option>
            </select>
          </label>
          <button id="refreshTodayBtn" class="button primary">最新表示</button>
        </section>


        <p class="notice">予想は研究用です。車券購入や利益を保証するものではありません。</p>
      </aside>

      <main class="workspace">
        <section class="panel active" id="panel-today">
          <header class="page-header">
            <div>
              <p class="greeting" id="greeting"></p>
              <h2>本日の予想</h2>
            </div>
            <span class="page-meta" id="todayMeta">読み込み中</span>
          </header>

          <nav class="venue-tabs" id="venueTabs" aria-label="会場切替"></nav>

          <div class="ai-record" id="aiRecordBar" aria-label="AI予想成績"></div>


          <div class="metric-strip" id="todayMetrics"></div>

          <section class="value-board" id="valueBoard" hidden></section>

          <section class="surface-panel ai-picks" id="aiPicksBoard" hidden></section>

          <section class="recommended-races" id="recommendedSection" hidden></section>

          <div class="race-list" id="forecastList"></div>
        </section>
        <!-- 学習状態パネルは非表示(利用者向けの情報ではなく、DBパス等の内部情報も含むため)。
             renderLearn() は #learnGrid が無ければ何もしないので、この節を消すだけでよい。 -->
      </main>
    </div>

    <script src="app.js?v=319157a3"></script>
  </body>
</html>
